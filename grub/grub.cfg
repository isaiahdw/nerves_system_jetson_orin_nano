# Main GRUB config, on the ESP at /EFI/BOOT/grub.cfg.
#
# Boot policy: an attached USB drive carrying /nerves-usb-boot.cfg (the
# provisioner stick) always wins; otherwise the A/B slot selected by
# grubenv boots.
#
# Slot state lives in ${prefix}/grubenv and uses GRUB's stock one-shot
# pattern (grub-reboot / grub-set-default):
#   saved_entry - the validated slot ("slot_a" / "slot_b")
#   next_entry  - one-shot override, set by a firmware upgrade and
#                 cleared here before the boot is attempted. If the new
#                 slot crashes, the watchdog resets the board and the
#                 cleared next_entry means saved_entry boots - that IS
#                 the revert mechanism.
# Validation from Linux = grub-editenv <ESP>/EFI/BOOT/grubenv set
# saved_entry=<slot>.

# USB-first: the provisioner stick carries nerves-usb-boot.cfg. As an
# if-condition the failed search does not print an error on the console.
if search --no-floppy --file --set=usbboot /nerves-usb-boot.cfg; then
    set root=${usbboot}
    configfile /nerves-usb-boot.cfg
fi

load_env
if [ -n "${next_entry}" ]; then
    set default="${next_entry}"
    set next_entry=
    save_env next_entry
else
    set default="${saved_entry}"
fi
# A missing or unreadable grubenv must still boot: default to slot A.
if [ -z "${default}" ]; then
    set default=slot_a
fi
# If the chosen slot's entry fails to load (wiped boot FAT, missing
# kernel), try the other slot rather than stopping at the menu.
if [ "${default}" = "slot_b" ]; then
    set fallback=slot_a
else
    set fallback=slot_b
fi
set timeout=0

# Each slot's kernel and DTB live on that slot's boot FAT, found by
# label (the provisioner stick uses different labels, so an attached
# stick can never satisfy these).
menuentry "slot_a" {
    search --no-floppy --label --set=root BOOTA
    devicetree /boot/tegra234-p3768-0000+p3767-0004-nv.dtb
    linux /boot/Image console=ttyTCU0,115200n8 root=PARTUUID=ac27cdd2-ac6b-4470-9b93-d6e3a6ed360a rootwait nvme.max_host_mem_size_mb=0
}

menuentry "slot_b" {
    search --no-floppy --label --set=root BOOTB
    devicetree /boot/tegra234-p3768-0000+p3767-0004-nv.dtb
    linux /boot/Image console=ttyTCU0,115200n8 root=PARTUUID=32ad86c0-1b7d-44eb-9a4f-5610d682a6db rootwait nvme.max_host_mem_size_mb=0
}
