# Firmware configuration file for the NVIDIA Jetson Orin Nano
# (Waveshare JETSON-ORIN-IO-BASE carrier, NVMe boot)
#
# Boot flow: BootROM -> MB1/MB2 -> UEFI (all in module QSPI-NOR, never on
# this disk) -> L4TLauncher picks the GPT partition named "APP" (slot A) or
# "APP_b" (slot B) per its rootfs-A/B UEFI variables -> reads
# boot/extlinux/extlinux.conf from that FAT partition -> kernel boots via
# its EFI stub -> squashfs rootfs (root=PARTUUID=<slot GUID>).
#
# The disk carries no bootloader. Writing this image to a USB stick or the
# NVMe boots on any Orin Nano whose QSPI firmware is provisioned (rootfs
# A/B enabled with ROOTFS_AB=1 for upgrades; a single "APP" partition boots
# even without it). Nothing on the disk is signature-checked by the QSPI
# chain (UEFI Secure Boot off).
#
# UEFI slot selection is NOT switched by fwup (fwup has no UEFI-variable
# support). After an upgrade task completes, the caller must point UEFI at
# the new slot - see /usr/sbin/nerves-uefi-sync in the rootfs.

require-fwup-version="1.12.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

# File resources are listed in the order that they are included in the .fw file
# This is important, since this is the order that they're written on a firmware
# update due to the event driven nature of the update system.
# L4TLauncher, the UEFI OS loader (see uefi/README.md). Written once by
# the factory task; upgrades never touch the ESP.
file-resource BOOTAA64.efi {
    host-path = "${NERVES_SYSTEM}/images/BOOTAA64.efi"
}
file-resource Image {
    host-path = "${NERVES_SYSTEM}/images/Image"
}
# This must match BR2_LINUX_KERNEL_INTREE_DTS_NAME in nerves_defconfig and
# the FDT lines in extlinux-a/b.conf. Written per-slot, so a reverted
# upgrade never leaves the surviving slot with the other slot's device tree.
file-resource devicetree.dtb {
    host-path = "${NERVES_SYSTEM}/images/tegra234-p3768-0000+p3767-0004-nv.dtb"
}
file-resource extlinux-a.conf {
    host-path = "${NERVES_SYSTEM}/images/extlinux-a.conf"
}
file-resource extlinux-b.conf {
    host-path = "${NERVES_SYSTEM}/images/extlinux-b.conf"
}
file-resource rootfs.img {
    host-path = ${ROOTFS}

    # Error out if the rootfs size exceeds the partition size
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

gpt gpt {
    guid = ${DISK_UUID}

    partition 0 {
        block-offset = ${ESP_PART_OFFSET}
        block-count = ${ESP_PART_COUNT}
        type = ${ESP_PART_TYPE}
        guid = ${ESP_PART_GUID}
        name = "esp"
    }
    # "APP" / "APP_b" are the names L4TLauncher matches on; they are fixed
    # by NVIDIA's firmware and cannot be renamed.
    partition 1 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_A_PART_GUID}
        name = "APP"
    }
    partition 2 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_B_PART_GUID}
        name = "APP_b"
    }
    partition 3 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_A_PART_GUID}
        name = "rootfs_a"
    }
    partition 4 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_B_PART_GUID}
        name = "rootfs_b"
    }
    partition 5 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${DATA_PART_GUID}
        name = "data"
        expand = true
    }
}

# Location where installed firmware information is stored.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# This firmware task writes everything to the destination media.
# Run at provisioning time (or onto a USB stick for bring-up).
task complete {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt)

        # Initialize the Nerves environment block (valid CRC, empty) so the
        # uboot_setenv calls below have something to modify. There is no
        # U-Boot to provide defaults; nothing else initializes this block.
        uboot_clearenv(uboot-env)

        fat_mkfs(${ESP_PART_OFFSET}, ${ESP_PART_COUNT})
        fat_setlabel(${ESP_PART_OFFSET}, "ESP")
        fat_mkdir(${ESP_PART_OFFSET}, "EFI")
        fat_mkdir(${ESP_PART_OFFSET}, "EFI/BOOT")

        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "NERVESA")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "boot")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "boot/extlinux")

        # Slot B is formatted but empty at the factory (keeps the .fw
        # under 4 GiB); the first upgrade populates it. NOTE: populate B
        # before ever enabling firmware rootfs A/B redundancy - failover
        # into an empty slot loops through recovery (provisioning.md).
        fat_mkfs(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
        fat_setlabel(${BOOT_B_PART_OFFSET}, "NERVESB")
        fat_mkdir(${BOOT_B_PART_OFFSET}, "boot")
        fat_mkdir(${BOOT_B_PART_OFFSET}, "boot/extlinux")
    }

    on-resource BOOTAA64.efi { fat_write(${ESP_PART_OFFSET}, "EFI/BOOT/BOOTAA64.efi") }
    on-resource Image { fat_write(${BOOT_A_PART_OFFSET}, "boot/Image") }
    on-resource devicetree.dtb { fat_write(${BOOT_A_PART_OFFSET}, "boot/tegra234-p3768-0000+p3767-0004-nv.dtb") }
    on-resource extlinux-a.conf {
        fat_write(${BOOT_A_PART_OFFSET}, "boot/extlinux/extlinux.conf")

        # Include provisioning instructions
        include("${NERVES_PROVISIONING}")

        # Add in the generic Nerves metadata variables. The factory image
        # is trusted by definition: without validated=1 the upgrade tasks
        # (which require it) can never run. sige5 gets this from its
        # initial U-Boot env image; here the env starts from
        # uboot_clearenv, so set it explicitly.
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }
    on-resource rootfs.img {
        # write to the first rootfs partition
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Slot B is empty: no b.* metadata (a revert must be impossible
        # until an upgrade populates B). Invalidate rootfs B and the
        # data partition so nothing stale is mistaken for a filesystem.
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
        raw_memset(${DATA_PART_OFFSET}, 256, 0xff)
    }
}

# Provisioning-media variant of `complete`: identical layout and slot-A
# payload, but the data partition is formatted FAT32 ("STAGING") so a
# host computer can copy a firmware archive onto the written media.
# This is the offline factory-provisioning path in docs/provisioning.md:
# write a USB drive with this task, copy the .fw for the internal disk
# onto the STAGING volume, boot the drive, and run fwup against the
# internal disk from the local file. The device reformats a FAT32 data
# partition to f2fs automatically on first boot from the internal disk
# (nerves_runtime corrupt-filesystem handling), so this task is also
# safe, if pointless, on an internal disk.
# KEEP IN SYNC with `task complete` above except where commented.
task complete-provisioner {
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt)
        uboot_clearenv(uboot-env)

        fat_mkfs(${ESP_PART_OFFSET}, ${ESP_PART_COUNT})
        fat_setlabel(${ESP_PART_OFFSET}, "ESP")
        fat_mkdir(${ESP_PART_OFFSET}, "EFI")
        fat_mkdir(${ESP_PART_OFFSET}, "EFI/BOOT")

        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "NERVESA")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "boot")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "boot/extlinux")

        fat_mkfs(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
        fat_setlabel(${BOOT_B_PART_OFFSET}, "NERVESB")
    }

    on-resource BOOTAA64.efi { fat_write(${ESP_PART_OFFSET}, "EFI/BOOT/BOOTAA64.efi") }
    on-resource Image { fat_write(${BOOT_A_PART_OFFSET}, "boot/Image") }
    on-resource devicetree.dtb { fat_write(${BOOT_A_PART_OFFSET}, "boot/tegra234-p3768-0000+p3767-0004-nv.dtb") }
    on-resource extlinux-b.conf { fat_write(${BOOT_B_PART_OFFSET}, "boot/extlinux/extlinux.conf") }
    on-resource extlinux-a.conf {
        fat_write(${BOOT_A_PART_OFFSET}, "boot/extlinux/extlinux.conf")
        include("${NERVES_PROVISIONING}")
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }
    on-resource rootfs.img { raw_write(${ROOTFS_A_PART_OFFSET}) }

    on-finish {
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)
        # DIFFERENCE from `complete`: FAT32 staging volume instead of an
        # invalidated (f2fs-to-be) data partition. Fixed 16 GiB
        # filesystem: DATA_PART_COUNT is the tiny pre-expand size, and
        # the filesystem may be smaller than the expanded partition.
        fat_mkfs(${DATA_PART_OFFSET}, 33554432)
        fat_setlabel(${DATA_PART_OFFSET}, "STAGING")
    }
}

task upgrade.a {
    # This task upgrades the A slot
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Require that the running version of firmware has been validated.
    # If it has not, then failing back is not guaranteed to work.
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading slot A")

        # Clear some firmware information just in case this update gets
        # interrupted midway. If this slot was bootable, it's not going to
        # be soon.
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")

        # Reformat this slot's boot partition: each slot's boot files live
        # in their own FAT, so this cannot touch the running slot.
        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "NERVESA")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "boot")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "boot/extlinux")

        # Indicate that the entire rootfs partition can be cleared
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }

    # Delta sources point at slot B's copies of the same files.
    on-resource Image {
        delta-source-fat-offset=${BOOT_B_PART_OFFSET}
        delta-source-fat-path="boot/Image"
        fat_write(${BOOT_A_PART_OFFSET}, "boot/Image")
    }
    on-resource devicetree.dtb {
        delta-source-fat-offset=${BOOT_B_PART_OFFSET}
        delta-source-fat-path="boot/tegra234-p3768-0000+p3767-0004-nv.dtb"
        fat_write(${BOOT_A_PART_OFFSET}, "boot/tegra234-p3768-0000+p3767-0004-nv.dtb")
    }
    on-resource extlinux-a.conf { fat_write(${BOOT_A_PART_OFFSET}, "boot/extlinux/extlinux.conf") }
    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_COUNT}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Update firmware metadata
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Reset the validation status and boot to A next time. The UEFI
        # slot switch (nvbootctrl) happens after fwup exits - see
        # nerves-uefi-sync; nerves_fw_active is the source of truth.
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
        # Scrub bootcount-feature variables this system never uses: a stale
        # upgrade_available masks the real nerves_fw_validated in
        # nerves_runtime's validation heuristic.
        uboot_unsetenv(uboot-env, "upgrade_available")
        uboot_unsetenv(uboot-env, "bootcount")
    }

    on-error {
    }
}

task upgrade.b {
    # This task upgrades the B slot
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading slot B")

        # Clear some firmware information just in case this update gets
        # interrupted midway.
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")

        fat_mkfs(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
        fat_setlabel(${BOOT_B_PART_OFFSET}, "NERVESB")
        fat_mkdir(${BOOT_B_PART_OFFSET}, "boot")
        fat_mkdir(${BOOT_B_PART_OFFSET}, "boot/extlinux")

        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }

    on-resource Image {
        delta-source-fat-offset=${BOOT_A_PART_OFFSET}
        delta-source-fat-path="boot/Image"
        fat_write(${BOOT_B_PART_OFFSET}, "boot/Image")
    }
    on-resource devicetree.dtb {
        delta-source-fat-offset=${BOOT_A_PART_OFFSET}
        delta-source-fat-path="boot/tegra234-p3768-0000+p3767-0004-nv.dtb"
        fat_write(${BOOT_B_PART_OFFSET}, "boot/tegra234-p3768-0000+p3767-0004-nv.dtb")
    }
    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_COUNT}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    on-finish {
        # Update firmware metadata
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Reset the validation status and boot to B next time.
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
        uboot_unsetenv(uboot-env, "upgrade_available")
        uboot_unsetenv(uboot-env, "bootcount")
    }

    on-error {
    }
}

task upgrade.unvalidated {
    require-uboot-variable(uboot-env, "nerves_fw_validated", "0")

    on-init {
        error("Please validate the running firmware before upgrading it again.")
    }
}

task upgrade.unexpected {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        error("Please check the media being upgraded. It doesn't look like either the A or B slots are active.")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

task provision {
    require-unmounted-destination = true
    on-init {
        include("${NERVES_PROVISIONING}")
    }
}
task provision.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}
