# Read by L4TLauncher (NVIDIA UEFI in QSPI) from slot B's FAT boot
# partition ("APP_b") at boot/extlinux/extlinux.conf.
#
# See extlinux-a.conf for details. Keep the two files in sync except for
# root= (ROOTFS_B_PART_GUID in fwup_include/fwup-common.conf).
DEFAULT nerves
TIMEOUT 30
MENU TITLE Nerves slot B

LABEL nerves
    MENU LABEL Nerves (in-tree DTB)
    LINUX /boot/Image
    FDT /boot/tegra234-p3768-0000+p3767-0004-nv.dtb
    APPEND console=ttyTCU0,115200n8 root=PARTUUID=32ad86c0-1b7d-44eb-9a4f-5610d682a6db rootwait nvme.max_host_mem_size_mb=0

LABEL nerves-fwdt
    MENU LABEL Nerves (firmware device tree)
    LINUX /boot/Image
    APPEND console=ttyTCU0,115200n8 root=PARTUUID=32ad86c0-1b7d-44eb-9a4f-5610d682a6db rootwait nvme.max_host_mem_size_mb=0
