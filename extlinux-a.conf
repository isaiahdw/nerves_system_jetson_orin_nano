# Read by L4TLauncher (NVIDIA UEFI in QSPI) from slot A's FAT boot
# partition at boot/extlinux/extlinux.conf. Paths below are relative to
# that partition's root. This file is static per slot: the "APP" partition
# always boots slot A, so an upgrade writes files, never edits configs.
#
# Keep in sync with extlinux-b.conf except for root= (ROOTFS_A_PART_GUID
# in fwup_include/fwup-common.conf).
#
# TIMEOUT is in tenths of a second. The menu is reachable over the debug
# UART (ttyTCU0, 115200).
#
# nvme.max_host_mem_size_mb=0 disables the NVMe Host Memory Buffer: the
# MAXIO MAP1202 (DRAM-less) returns corrupt reads under sustained I/O with
# HMB enabled, which surfaces as SQUASHFS errors on the live rootfs.
DEFAULT nerves
TIMEOUT 30
MENU TITLE Nerves slot A

LABEL nerves
    MENU LABEL Nerves (in-tree DTB)
    LINUX /boot/Image
    FDT /boot/tegra234-p3768-0000+p3767-0004-nv.dtb
    APPEND console=ttyTCU0,115200n8 root=PARTUUID=ac27cdd2-ac6b-4470-9b93-d6e3a6ed360a rootfstype=squashfs rootwait nvme.max_host_mem_size_mb=0

# Fallback: no FDT line makes L4TLauncher hand the kernel the UEFI-provided
# device tree (the QSPI kernel-dtb with L4TConfiguration overlays applied).
# Useful if the in-tree devkit DT turns out wrong for the Waveshare carrier.
LABEL nerves-fwdt
    MENU LABEL Nerves (firmware device tree)
    LINUX /boot/Image
    APPEND console=ttyTCU0,115200n8 root=PARTUUID=ac27cdd2-ac6b-4470-9b93-d6e3a6ed360a rootfstype=squashfs rootwait nvme.max_host_mem_size_mb=0
