# Post-installation firmware operations for the Jetson Orin Nano
#
# Tasks include:
#
# * `factory-reset` - Clear out the writable filesystem and any other writable
#                   areas so that they can be re-initialized on the next boot.
# * `prevent-revert` - Prevent `revert` from working until the next firmware
# * `revert` - Revert to the previous firmware if it's still available
# * `validate` - Mark this firmware as a good update.
# * `status` - Print out which slot is active (`a` or `b`)
# * `expand` - Rewrite the GPT so the data partition fills the disk. Used by
#              /usr/sbin/expand-app-fs on the first boot after an image
#              flash (writing the image as a file freezes the expandable
#              partition at image size).
#
# To use:
#
# 1. Run `fwup -c -f fwup-ops.conf -o ops.fw` and copy ops.fw to
#    the device. This is done automatically as part of the Nerves system
#    build process. The file is stored in `/usr/share/fwup/ops.fw`.
# 2. On the device, run `fwup -a -t <task> -d /dev/rootdisk0 --enable-trim -i /usr/share/fwup/ops.fw`.
# 3. Reboot after running `revert` or `factory-reset`.
#
# It is critical that this is kept in sync with the main fwup.conf.
#
# NOTE: these tasks change only the Nerves environment. Which slot the
# boot firmware loads is separate state that fwup cannot write:
# /usr/sbin/nerves-uefi-sync (GPT name swap) must run after upgrade or
# revert and before the reboot, and reboots must not proceed if it
# fails. The firmware's per-boot retry counters are cleared separately
# by /usr/sbin/nerves-boot-success (nvbootctrl verify) on every boot.

require-fwup-version="1.10.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

# Location where installed firmware information is stored.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# Same GPT as fwup.conf. When this is applied to the NVMe block device the
# destination size is known, so the data partition's expand takes effect.
gpt gpt {
    guid = ${DISK_UUID}

    partition 0 {
        block-offset = ${ESP_PART_OFFSET}
        block-count = ${ESP_PART_COUNT}
        type = ${ESP_PART_TYPE}
        guid = ${ESP_PART_GUID}
        name = "esp"
    }
    partition 1 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_A_PART_GUID}
        name = "APP"
    }
    partition 2 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_B_PART_GUID}
        name = "APP_b"
    }
    partition 3 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_A_PART_GUID}
        name = "rootfs_a"
    }
    partition 4 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_B_PART_GUID}
        name = "rootfs_b"
    }
    partition 5 {
        block-offset = ${DATA_PART_OFFSET}
        block-count = ${DATA_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${DATA_PART_GUID}
        name = "data"
        expand = true
    }
}

##
# factory-reset
##
task factory-reset {
    on-init {
        info("Erasing all writable data")
        # This requires --enable-trim
        trim(${DATA_PART_OFFSET}, ${DATA_PART_COUNT})
        raw_memset(${DATA_PART_OFFSET}, 256, 0xff)
    }
}

##
# prevent-revert
#
# Pass `--enable-trim` to also clear out the slot that no longer should be used.
##
task prevent-revert.a {
    # Check that we're running on B
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    on-init {
        info("Preventing reverts to slot A")
        # Remove variables that fwup uses to allow reverting images
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        # Clear out the old image using TRIM. This requires --enable-trim
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
        fat_rm(${BOOT_A_PART_OFFSET}, "boot/Image")
        fat_rm(${BOOT_A_PART_OFFSET}, "boot/tegra234-p3768-0000+p3767-0005.dtb")
        fat_rm(${BOOT_A_PART_OFFSET}, "boot/extlinux/extlinux.conf")
    }
}
task prevent-revert.b {
    # Check that we're running on A
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    on-init {
        info("Preventing reverts to slot B")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
        fat_rm(${BOOT_B_PART_OFFSET}, "boot/Image")
        fat_rm(${BOOT_B_PART_OFFSET}, "boot/tegra234-p3768-0000+p3767-0005.dtb")
        fat_rm(${BOOT_B_PART_OFFSET}, "boot/extlinux/extlinux.conf")
    }
}
task prevent-revert.fail {
    on-init {
        error("Error detecting active slot")
    }
}

##
# revert
#
# Run /usr/sbin/nerves-uefi-sync after this and before rebooting so
# L4TLauncher agrees with nerves_fw_active about the slot.
##
task revert.a {
    # This task reverts to the A slot, so check that we're running on B
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Verify that slot A has the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Reverting to slot A")

        # Switch over
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
}

task revert.b {
    # This task reverts to the B slot, so check that we're running on A
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    # Verify that slot B has the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Reverting to slot B")

        # Switch over
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
}

task revert.unexpected.a {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        # Case where A is good, and the desire is to go to B.
        error("It doesn't look like there's anything to revert to in slot B.")
    }
}
task revert.unexpected.b {
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        # Case where B is good, and the desire is to go to A.
        error("It doesn't look like there's anything to revert to in slot A.")
    }
}

task revert.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

##
# status
#
# Run "fwup /usr/share/fwup/ops.fw -t status -d /dev/rootdisk0 -q -U" to check the status.
##
task status.aa {
    require-path-on-device("/", "/dev/nvme0n1p4")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("a") }
}
task status.ab {
    require-path-on-device("/", "/dev/nvme0n1p4")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("a->b") }
}
task status.bb {
    require-path-on-device("/", "/dev/nvme0n1p5")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("b") }
}
task status.ba {
    require-path-on-device("/", "/dev/nvme0n1p5")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("b->a") }
}
task status.fail {
    on-init { error("fail") }
}

##
# expand
#
# Only rewrites the partition table; partition contents are untouched.
# Idempotent: on a disk that is already fully expanded this writes back the
# same table.
##
task expand {
    on-init {
        info("Expanding the data partition to fill the disk")
        gpt_write(gpt)
    }
}

##
# validate
##
task validate {
    on-init {
        info("Validate")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_unsetenv(uboot-env, "upgrade_available")
        uboot_unsetenv(uboot-env, "bootcount")
    }
}
