# Firmware metadata and disk layout shared by fwup.conf and fwup-ops.conf
#
# All of these can be overridden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
# Hardware identity: module + carrier. Shows up in `fwup -m` and on the
# device as a.nerves_fw_description / b.nerves_fw_description.
define(NERVES_FW_DESCRIPTION, "Jetson Orin Nano 4GB (p3767-0004) on Waveshare JETSON-ORIN-IO-BASE")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "jetson_orin_nano")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Isaiah")

# The NVMe SSD on the carrier's M.2 Key-M slot (the boot device).
define(NERVES_FW_DEVPATH, "/dev/nvme0n1")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/nvme0n1p6") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Boot architecture: the NVIDIA boot chain (MB1/MB2/UEFI) lives in the
# module's QSPI-NOR flash. UEFI's per-device boot entry runs
# EFI/BOOT/BOOTAA64.efi (NVIDIA's L4TLauncher, see uefi/README.md) from
# the ESP on this disk; L4TLauncher then picks a boot partition by its
# GPT *name* - "APP" for slot A, "APP_b" for slot B (fixed,
# non-configurable names) - and reads boot/extlinux/extlinux.conf from
# the FAT filesystem on it. Each slot has its own FAT boot partition
# carrying kernel + DTB + extlinux.conf, so a slot switch never rewrites
# the other slot's boot files. The ESP is required: without it no UEFI
# boot entry can start from this disk (L4TLauncher instances only search
# the device they were launched from).
#
# Which slot boots is UEFI-variable state (rootfs A/B: RootfsStatusSlotA/B
# + retry counters in a Tegra scratch register), owned by L4TLauncher and
# switched from Linux via nvbootctrl - fwup cannot touch it. The uboot-env
# block below stores only the Nerves metadata (no U-Boot exists or is
# needed; fwup and fw_env.config just share the storage format).
#
# +--------------------------------+
# | GPT                            |
# +--------------------------------+ <-- sector 1024 (512 KB)
# | Nerves firmware configuration  |
# | (formatted as U-Boot env)      |
# +--------------------------------+ <-- sector 2048 (1 MB)
# | p1: ESP (FAT32)                |
# |     EFI/BOOT/BOOTAA64.efi      |
# +--------------------------------+
# | p2: "APP" boot A (FAT32)       |
# |     boot/extlinux/extlinux.conf|
# |     boot/Image, boot/*.dtb     |
# +--------------------------------+
# | p3: "APP_b" boot B (FAT32)     |
# +--------------------------------+
# | p4: Rootfs A (squashfs)        |
# +--------------------------------+
# | p5: Rootfs B (squashfs)        |
# +--------------------------------+
# | p6: Application data (f2fs)    |
# +--------------------------------+

# The Nerves environment block sits between the GPT and the first
# partition. NOTE: This must match rootfs_overlay/etc/fw_env.config
# (sector 1024 = 512 KB = 0x80000, 128 KB).
define(UBOOT_ENV_OFFSET, 1024)
define(UBOOT_ENV_COUNT, 256)  # 128 KB

# The ESP: 64 MB FAT carrying only L4TLauncher. Written by the factory
# task, untouched by upgrades.
define(ESP_PART_OFFSET, 2048)
define(ESP_PART_COUNT, 131072)

# Per-slot boot partitions. 128 MB each: an uncompressed arm64 Image is
# ~40 MB and the slot also carries a DTB and extlinux.conf.
define-eval(BOOT_A_PART_OFFSET, "${ESP_PART_OFFSET} + ${ESP_PART_COUNT}")
define(BOOT_A_PART_COUNT, 262144)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, ${BOOT_A_PART_COUNT})

# Let each rootfs have room to grow up to 1 GiB. The CUDA milestone will
# need more; the layout is rewritten then (pre-1.0, breaking flash layout
# changes are acceptable).
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 2097152)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application data partition. This partition can occupy all of the remaining
# space. Size it to fit the destination.
define-eval(DATA_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(DATA_PART_COUNT, 1048576)

# GPT identifiers. The rootfs GUIDs double as the root= kernel arguments
# (root=PARTUUID=...) in the extlinux configs, which keeps root selection
# independent of storage enumeration order.
define(DISK_UUID, "34665102-35fd-4b11-98fb-5024fa94e6dc")
define(ESP_PART_TYPE, "c12a7328-f81f-11d2-ba4b-00a0c93ec93b")   # EFI System Partition
define(BOOT_PART_TYPE, "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7")  # Microsoft basic data (FAT)
define(LINUX_PART_TYPE, "0fc63daf-8483-4772-8e79-3d69d8477de4") # Linux filesystem
define(ESP_PART_GUID, "125b6cee-c350-4bf6-87ad-211b46c3321a")
define(BOOT_A_PART_GUID, "3a099a8a-a16e-4580-8a8d-21de96724c4f")
define(BOOT_B_PART_GUID, "b8ebc237-529b-4eb3-aed0-c14e77e6cc2a")
define(ROOTFS_A_PART_GUID, "ac27cdd2-ac6b-4470-9b93-d6e3a6ed360a")
define(ROOTFS_B_PART_GUID, "32ad86c0-1b7d-44eb-9a4f-5610d682a6db")
define(DATA_PART_GUID, "2b3628c4-ec56-4d0c-97a8-eb8dab421b55")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
