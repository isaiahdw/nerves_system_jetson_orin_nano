# Boot config for the provisioning stick. Reached two ways:
#   - the internal disk's GRUB finds this file on an attached drive and
#     sources it (USB-first policy in grub.cfg), or
#   - UEFI boots the stick directly (no bootable internal disk) via the
#     stick's own EFI/BOOT copy of GRUB, whose grub.cfg is this file.
# Labels and PARTLABELs are provisioner-specific so nothing here can
# resolve to the internal disk.
set timeout=0
set default=provisioner

menuentry "provisioner" {
    search --no-floppy --label --set=root PROVA
    devicetree /boot/tegra234-p3768-0000+p3767-0004-nv.dtb
    linux /boot/Image console=ttyTCU0,115200n8 root=PARTLABEL=prov_rootfs_a rootwait nvme.max_host_mem_size_mb=0
}
